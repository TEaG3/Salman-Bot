default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS", 5) %>
  url: <%= ENV.fetch("DATABASE_URL", "postgresql://localhost/salman_bot_development") %>

development:
  <<: *default

test:
  <<: *default
  database: salman_bot_test

production:
  <<: *default
